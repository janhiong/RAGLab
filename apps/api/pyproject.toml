[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "raglab-api"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "psycopg[binary]==3.2.9", "pydantic-settings==2.9.1", "python-multipart==0.0.22", "pypdf==6.1.1", "httpx==0.28.1"]

[project.optional-dependencies]
vector = ["sentence-transformers==4.1.0", "transformers==4.51.3"]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
