services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: raglab
      POSTGRES_PASSWORD: raglab
      POSTGRES_DB: raglab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - raglab-db:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raglab -d raglab"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://raglab:raglab@db:5432/raglab
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  raglab-db:
